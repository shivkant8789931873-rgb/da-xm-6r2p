document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ sn.count }} · Adding or removing someone clears the draw.<\u002Fspan>\n        <button class=\"btn btn-primary\" style=\"border-radius:999px; white-space:nowrap; align-self:flex-start\" sc-camel-on-click=\"{{ drawNames }}\">Draw names 🎅<\u002Fbutton>\n      <\u002Fsection>\n      <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:4px\">\n        <div style=\"display:flex; flex-direction:column; gap:2px; padding-bottom:8px\"><h3 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:20px\">The draw<\u002Fh3><span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ sn.info }}<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ sn.pairs }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--color-divider)\">\n            <span style=\"flex:1; min-width:0; font-weight:600; font-size:14px\">{{ p.giver }} gives to<\u002Fspan>\n            <button class=\"btn btn-secondary\" style=\"border-radius:999px; white-space:nowrap; font-weight:{{ p.fw }}\" sc-camel-on-click=\"{{ p.toggle }}\">{{ p.shown }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ sn.noPairs }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0; font-size:14px; color:var(--color-neutral-700)\">Add at least 3 people, then press Draw names. Nobody gets themselves. Pass the phone around and let each person tap their own name.<\u002Fp><\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CARDS -->\n  <sc-if value=\"{{ is.cards }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px\">\n      <sc-for list=\"{{ cardStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"background:{{ s.bg }}; border-radius:var(--radius-lg); padding:18px 20px; display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow-sm)\"><span style=\"font-family:var(--font-heading); font-size:28px; color:{{ s.fg }}\">{{ s.n }}<\u002Fspan><span style=\"font-size:13px; font-weight:600; color:{{ s.fg }}\">{{ s.label }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:8px 8px 14px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:6px\">\n      <div style=\"overflow-x:auto\">\n        <sc-raw-table class=\"table\" style=\"width:100%; min-width:760px; border-collapse:collapse; font-size:14px\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left\"><sc-raw-th style=\"padding:10px 8px\">Name<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 8px; min-width:300px\">Address<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 8px; width:110px\">Card sent<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 8px; width:120px\">Card received<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ cardRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <sc-raw-tr style=\"border-top:1px solid var(--color-divider)\">\n                <sc-raw-td style=\"padding:8px; font-weight:600\">{{ r.name }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 8px\"><input class=\"input\" style=\"padding:7px 12px; border-radius:999px; font-size:14px; width:100%; box-sizing:border-box\" placeholder=\"Street, city, ZIP\" value=\"{{ r.address }}\" sc-camel-on-change=\"{{ r.setAddress }}\"><\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 8px\"><input type=\"checkbox\" aria-label=\"Card sent\" checked=\"{{ r.s }}\" sc-camel-on-change=\"{{ r.toggleS }}\"><\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 8px\"><input type=\"checkbox\" aria-label=\"Card received\" checked=\"{{ r.r }}\" sc-camel-on-change=\"{{ r.toggleR }}\"><\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"margin:4px 12px 0; font-size:13px; color:var(--color-neutral-700)\">Everyone in People appears here. Ticks are saved per year, so next year starts fresh while addresses stay.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- MEAL -->\n  <sc-if value=\"{{ is.meal }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"display:flex; flex-wrap:wrap; align-items:flex-end; gap:20px; padding:20px 24px; border-radius:var(--radius-lg); background:var(--color-neutral-100); box-shadow:var(--shadow-sm)\">\n      <div class=\"field\" style=\"flex:0 1 180px\"><label>Guests at the table<\u002Flabel><input class=\"input\" type=\"number\" inputmode=\"numeric\" style=\"border-radius:999px; font-weight:700\" value=\"{{ mealGuests }}\" sc-camel-on-change=\"{{ setMealGuests }}\"><\u002Fdiv>\n      <div class=\"field\" style=\"flex:0 1 200px\"><label>Dinner time<\u002Flabel><input class=\"input\" type=\"time\" style=\"border-radius:999px\" value=\"{{ mealTime }}\" sc-camel-on-change=\"{{ setMealTime }}\"><\u002Fdiv>\n    <\u002Fsection>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; align-items:start\">\n      <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:12px\">\n        <h3 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:20px\">Menu<\u002Fh3>\n        <sc-for list=\"{{ menu }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"field\"><label>{{ c.label }}<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"{{ c.ph }}\" value=\"{{ c.val }}\" sc-camel-on-change=\"{{ c.set }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n        <button data-noprint=\"1\" class=\"btn btn-secondary\" style=\"border-radius:999px; white-space:nowrap; align-self:flex-start\" sc-camel-on-click=\"{{ menuToList }}\">Add dishes to shopping list<\u002Fbutton>\n      <\u002Fsection>\n      <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:6px\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px; padding-bottom:6px\"><h3 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:20px\">Shopping list<\u002Fh3><span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ shopCount }}<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ shopRows }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--color-divider)\">\n            <input type=\"checkbox\" aria-label=\"Bought\" checked=\"{{ s.done }}\" sc-camel-on-change=\"{{ s.toggle }}\">\n            <input style=\"all:unset; flex:1; min-width:0; font-size:14px; text-decoration:{{ s.deco }}; color:{{ s.color }}\" value=\"{{ s.item }}\" sc-camel-on-change=\"{{ s.setItem }}\">\n            <input style=\"all:unset; width:70px; font-size:13px; color:var(--color-neutral-700); text-align:right\" placeholder=\"Qty\" value=\"{{ s.qty }}\" sc-camel-on-change=\"{{ s.setQty }}\">\n            <button data-noprint=\"1\" class=\"btn btn-ghost btn-icon\" style=\"border-radius:999px; width:30px; height:30px; padding:0\" aria-label=\"Remove\" sc-camel-on-click=\"{{ s.remove }}\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div data-noprint=\"1\" style=\"display:flex; gap:8px; padding-top:8px\">\n          <input class=\"input\" style=\"border-radius:999px; flex:1; min-width:0\" placeholder=\"Add an item\" value=\"{{ newShop }}\" sc-camel-on-change=\"{{ setNewShop }}\">\n          <button class=\"btn btn-primary\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ addShop }}\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <button data-noprint=\"1\" class=\"btn btn-ghost\" style=\"border-radius:999px; white-space:nowrap; align-self:flex-start\" sc-camel-on-click=\"{{ clearBought }}\">Clear bought items<\u002Fbutton>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- EVENTS -->\n  <sc-if value=\"{{ is.events }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-noprint=\"1\" style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:18px 22px; box-shadow:var(--shadow-sm); display:flex; flex-wrap:wrap; gap:12px; align-items:end\">\n      <div class=\"field\" style=\"flex:1 1 150px\"><label>Date<\u002Flabel><input class=\"input\" type=\"date\" style=\"border-radius:999px\" value=\"{{ nev.date }}\" sc-camel-on-change=\"{{ nevSet.date }}\"><\u002Fdiv>\n      <div class=\"field\" style=\"flex:0 1 130px\"><label>Time<\u002Flabel><input class=\"input\" type=\"time\" style=\"border-radius:999px\" value=\"{{ nev.time }}\" sc-camel-on-change=\"{{ nevSet.time }}\"><\u002Fdiv>\n      <div class=\"field\" style=\"flex:2 1 200px\"><label>What<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"e.g. Office party\" value=\"{{ nev.title }}\" sc-camel-on-change=\"{{ nevSet.title }}\"><\u002Fdiv>\n      <div class=\"field\" style=\"flex:2 1 180px\"><label>Where / notes<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"Optional\" value=\"{{ nev.where }}\" sc-camel-on-change=\"{{ nevSet.where }}\"><\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ addEvent }}\">Add event<\u002Fbutton>\n    <\u002Fsection>\n    <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column\">\n      <sc-for list=\"{{ eventRows }}\" as=\"e\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--color-divider); opacity:{{ e.op }}\">\n          <div style=\"width:50px; flex:none; display:flex; flex-direction:column; align-items:center; border-radius:14px; background:var(--color-accent-100); color:var(--color-accent-800); padding:4px 0\"><span style=\"font-size:11px; font-weight:700; text-transform:uppercase\">{{ e.mon }}<\u002Fspan><span style=\"font-family:var(--font-heading); font-size:18px; line-height:1.1\">{{ e.day }}<\u002Fspan><\u002Fdiv>\n          <input class=\"input\" type=\"date\" aria-label=\"Date\" style=\"width:150px; border-radius:999px; padding:7px 10px; font-size:13px\" value=\"{{ e.date }}\" sc-camel-on-change=\"{{ e.set.date }}\">\n          <input class=\"input\" type=\"time\" aria-label=\"Time\" style=\"width:118px; border-radius:999px; padding:7px 10px; font-size:13px\" value=\"{{ e.time }}\" sc-camel-on-change=\"{{ e.set.time }}\">\n          <input class=\"input\" aria-label=\"What\" style=\"flex:2 1 180px; min-width:0; border-radius:999px; padding:7px 12px; font-size:15px; font-weight:600\" value=\"{{ e.title }}\" sc-camel-on-change=\"{{ e.set.title }}\">\n          <input class=\"input\" aria-label=\"Where\" style=\"flex:2 1 160px; min-width:0; border-radius:999px; padding:7px 12px; font-size:14px\" placeholder=\"Where / notes\" value=\"{{ e.where }}\" sc-camel-on-change=\"{{ e.set.where }}\">\n          <button data-noprint=\"1\" class=\"btn btn-ghost btn-icon\" style=\"border-radius:999px\" aria-label=\"Remove\" sc-camel-on-click=\"{{ e.remove }}\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noEvents }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0; font-size:14px; color:var(--color-neutral-700)\">No events for this Christmas yet.<\u002Fp><\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- CHECKLIST -->\n  <sc-if value=\"{{ is.checklist }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-noprint=\"1\" style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:18px 22px; box-shadow:var(--shadow-sm); display:flex; flex-wrap:wrap; gap:12px; align-items:end\">\n      <div class=\"field\" style=\"flex:2 1 240px\"><label>New task<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"e.g. Book the turkey\" value=\"{{ nt.text }}\" sc-camel-on-change=\"{{ ntSet.text }}\"><\u002Fdiv>\n      <div class=\"field\" style=\"flex:1 1 180px\"><label>When<\u002Flabel><sc-raw-select class=\"input\" style=\"border-radius:999px\" value=\"{{ nt.phase }}\" sc-camel-on-change=\"{{ ntSet.phase }}\"><sc-for list=\"{{ phaseOpts }}\" as=\"o\" hint-placeholder-count=\"7\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ addTask }}\">Add task<\u002Fbutton>\n    <\u002Fsection>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; align-items:start\">\n      <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"7\">\n        <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:20px 22px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:4px; outline:{{ p.outline }}\">\n          <div style=\"display:flex; align-items:center; gap:10px; padding-bottom:6px\">\n            <h3 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:19px; flex:1\">{{ p.label }}<\u002Fh3>\n            <sc-if value=\"{{ p.isNow }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-accent\" style=\"white-space:nowrap; flex-shrink:0\">Now<\u002Fspan><\u002Fsc-if>\n            <span style=\"font-size:13px; font-weight:600; color:var(--color-neutral-700); white-space:nowrap\">{{ p.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ p.tasks }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--color-divider)\">\n              <input type=\"checkbox\" checked=\"{{ t.done }}\" sc-camel-on-change=\"{{ t.toggle }}\" aria-label=\"Done\">\n              <input style=\"all:unset; flex:1; min-width:0; font-size:14px; text-decoration:{{ t.deco }}; color:{{ t.color }}\" value=\"{{ t.text }}\" sc-camel-on-change=\"{{ t.setText }}\">\n              <button data-noprint=\"1\" class=\"btn btn-ghost btn-icon\" style=\"border-radius:999px; width:30px; height:30px; padding:0\" aria-label=\"Remove task\" sc-camel-on-click=\"{{ t.remove }}\">✕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SETTINGS -->\n  <sc-if value=\"{{ is.settings }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; align-items:start\">\n      <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:14px\">\n        <h3 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:20px\">Personalise<\u002Fh3>\n        <div class=\"field\"><label>Theme<\u002Flabel><div style=\"display:flex; gap:4px; background:var(--color-neutral-200); padding:4px; border-radius:999px; width:max-content\"><sc-for list=\"{{ themeOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"all:unset; cursor:pointer; padding:7px 18px; border-radius:999px; font-size:14px; font-weight:600; background:{{ o.bg }}; color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>Your name<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" value=\"{{ st.name }}\" sc-camel-on-change=\"{{ sSet.name }}\"><\u002Fdiv>\n        <div class=\"field\"><label>Currency<\u002Flabel><sc-raw-select class=\"input\" style=\"border-radius:999px\" value=\"{{ st.currency }}\" sc-camel-on-change=\"{{ sSet.currency }}\"><sc-for list=\"{{ currencies }}\" as=\"c\" hint-placeholder-count=\"10\"><option value=\"{{ c.code }}\">{{ c.label }}<\u002Foption><\u002Fsc-for><option value=\"CUSTOM\">Custom symbol…<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <sc-if value=\"{{ customCur }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"field\"><label>Currency symbol<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"e.g. Rp\" value=\"{{ st.sym }}\" sc-camel-on-change=\"{{ sSet.sym }}\"><\u002Fdiv><\u002Fsc-if>\n        <p style=\"margin:0; font-size:13px; color:var(--color-neutral-700)\">Each Christmas keeps its own budget, gifts, spending, cards and checklist. Pick a year at the top to look back or plan ahead.<\u002Fp>\n      <\u002Fsection>\n      <section style=\"background:var(--color-neutral-100); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:14px\">\n        <h3 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:20px\">Backup &amp; data<\u002Fh3>\n        <p style=\"margin:0; font-size:14px; color:var(--color-neutral-700)\">Saved automatically on this device. Download a backup now and then, or to move to a new phone or computer.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px\">\n          <button class=\"btn btn-primary\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ exportJson }}\">Download backup<\u002Fbutton>\n          <label class=\"btn btn-secondary\" style=\"border-radius:999px; white-space:nowrap; cursor:pointer\">Restore from file<input type=\"file\" accept=\".json,application/json\" style=\"display:none\" sc-camel-on-change=\"{{ importJson }}\"><\u002Flabel>\n          <button class=\"btn btn-ghost\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ exportCsv }}\">Gifts CSV<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; padding-top:10px; border-top:1px solid var(--color-divider)\">\n          <button class=\"btn btn-secondary\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ clearAll }}\">Clear all data<\u002Fbutton>\n          <button class=\"btn btn-ghost\" style=\"border-radius:999px; white-space:nowrap\" sc-camel-on-click=\"{{ loadSample }}\">Reload sample data<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fmain>\n\n<sc-if value=\"{{ needsSetup }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"1\" style=\"position:fixed; inset:0; z-index:40; background:color-mix(in srgb, #0e1c17 70%, transparent); display:grid; place-items:center; padding:20px; overflow-y:auto\">\n    <section style=\"width:100%; max-width:540px; box-sizing:border-box; background:var(--color-neutral-100); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:30px; display:flex; flex-direction:column; gap:16px; border-top:8px solid var(--color-accent)\">\n      <div style=\"display:flex; align-items:center; gap:12px\">\n        <img src=\"167c00f9-994b-42c3-9449-4ccef991d4fb\" alt=\"DigitalAvori\" style=\"width:52px; height:52px; flex:none; border-radius:50%; object-fit:cover\">\n        <span style=\"font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--color-neutral-700)\">DigitalAvori · Christmas Budget &amp; Gift Tracker<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:6px\">\n        <h2 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:30px; line-height:1.1\">Merry planning! Let's set you up<\u002Fh2>\n        <p style=\"margin:0; font-size:15px; color:var(--color-neutral-700)\">Budget, gifts, cards, the Christmas meal and your to-do list in one place. Private on this device, works offline.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Your name<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"e.g. Emma\" value=\"{{ st.name }}\" sc-camel-on-change=\"{{ sSet.name }}\"><\u002Fdiv>\n      <div class=\"field\"><label>Christmas budget<\u002Flabel><input class=\"input\" type=\"number\" inputmode=\"decimal\" style=\"border-radius:999px\" value=\"{{ budgetVal }}\" sc-camel-on-change=\"{{ setBudget }}\"><\u002Fdiv>\n      <div class=\"field\"><label>Currency<\u002Flabel><sc-raw-select class=\"input\" style=\"border-radius:999px\" value=\"{{ st.currency }}\" sc-camel-on-change=\"{{ sSet.currency }}\"><sc-for list=\"{{ currencies }}\" as=\"c\" hint-placeholder-count=\"10\"><option value=\"{{ c.code }}\">{{ c.label }}<\u002Foption><\u002Fsc-for><option value=\"CUSTOM\">Custom symbol…<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <sc-if value=\"{{ customCur }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"field\"><label>Currency symbol<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"e.g. Rp\" value=\"{{ st.sym }}\" sc-camel-on-change=\"{{ sSet.sym }}\"><\u002Fdiv><\u002Fsc-if>\n      <div class=\"field\"><label>Theme<\u002Flabel><div style=\"display:flex; gap:4px; background:var(--color-neutral-200); padding:4px; border-radius:999px; width:max-content\"><sc-for list=\"{{ themeOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"all:unset; cursor:pointer; padding:7px 18px; border-radius:999px; font-size:14px; font-weight:600; background:{{ o.bg }}; color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; padding-top:4px\">\n        <button class=\"btn btn-primary\" style=\"border-radius:999px; padding:11px 22px; white-space:nowrap\" sc-camel-on-click=\"{{ finishBlank }}\">Start planning<\u002Fbutton>\n        <button class=\"btn btn-secondary\" style=\"border-radius:999px; padding:11px 22px; white-space:nowrap\" sc-camel-on-click=\"{{ finishSample }}\">Explore with sample data<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gd.open }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"1\" style=\"position:fixed; inset:0; z-index:45; background:color-mix(in srgb, #0e1c17 70%, transparent); display:grid; place-items:center; padding:20px; overflow-y:auto\">\n    <section style=\"width:100%; max-width:560px; box-sizing:border-box; background:var(--color-neutral-100); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:26px; display:flex; flex-direction:column; gap:12px; border-top:8px solid var(--color-accent)\">\n      <div style=\"display:flex; align-items:flex-start; gap:12px\">\n        <div style=\"display:flex; flex-direction:column; gap:2px; flex:1; min-width:0\"><span style=\"font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700)\">Delivery &amp; more<\u002Fspan><h2 style=\"margin:0; font-family:var(--font-heading); font-weight:400; font-size:26px; line-height:1.15\">{{ gd.idea }}<\u002Fh2><span style=\"font-size:14px; color:var(--color-neutral-700)\">For {{ gd.who }}<\u002Fspan><\u002Fdiv>\n        <button class=\"btn btn-ghost btn-icon\" style=\"border-radius:999px\" aria-label=\"Close\" sc-camel-on-click=\"{{ gd.close }}\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px\">\n        <div class=\"field\"><label>Online order<\u002Flabel><sc-raw-select class=\"input\" style=\"border-radius:999px\" value=\"{{ gd.ship }}\" sc-camel-on-change=\"{{ gd.set.ship }}\"><sc-for list=\"{{ shipOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n        <div class=\"field\"><label>Arrives<\u002Flabel><input class=\"input\" type=\"date\" style=\"border-radius:999px\" value=\"{{ gd.eta }}\" sc-camel-on-change=\"{{ gd.set.eta }}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Tracking number<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"Optional\" value=\"{{ gd.track }}\" sc-camel-on-change=\"{{ gd.set.track }}\"><\u002Fdiv>\n      <div class=\"field\"><label>Where it’s hidden<\u002Flabel><input class=\"input\" style=\"border-radius:999px\" placeholder=\"e.g. Top shelf of the wardrobe\" value=\"{{ gd.hide }}\" sc-camel-on-change=\"{{ gd.set.hide }}\"><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:end\">\n        <div class=\"field\"><label>Return by<\u002Flabel><input class=\"input\" type=\"date\" style=\"border-radius:999px\" value=\"{{ gd.returnBy }}\" sc-camel-on-change=\"{{ gd.set.returnBy }}\"><\u002Fdiv>\n        <label style=\"display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; padding-bottom:10px; cursor:pointer\"><input type=\"checkbox\" checked=\"{{ gd.receipt }}\" sc-camel-on-change=\"{{ gd.set.receipt }}\">Have a gift receipt<\u002Flabel>\n      <\u002Fdiv>\n      <label style=\"display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; cursor:pointer\"><input type=\"checkbox\" checked=\"{{ gd.stocking }}\" sc-camel-on-change=\"{{ gd.set.stocking }}\">Stocking filler 🧦<\u002Flabel>\n      <button class=\"btn btn-primary\" style=\"border-radius:999px; white-space:nowrap; align-self:flex-start\" sc-camel-on-click=\"{{ gd.close }}\">Done<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"1\" style=\"position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:50; background:var(--pine); color:#fff; padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:var(--shadow-lg); white-space:nowrap\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY='xmasbudget.v1';\nconst MODE_DEFAULT='full';\nconst PWA=true;\nconst CURRENCIES=[['$','USD','US Dollar','en-US'],['€','EUR','Euro','de-DE'],['£','GBP','British Pound','en-GB'],['C$','CAD','Canadian Dollar','en-CA'],['A$','AUD','Australian Dollar','en-AU'],['NZ$','NZD','New Zealand Dollar','en-NZ'],['₹','INR','Indian Rupee','en-IN'],['¥','JPY','Japanese Yen','ja-JP'],['CHF ','CHF','Swiss Franc','de-CH'],['S$','SGD','Singapore Dollar','en-SG'],['HK$','HKD','Hong Kong Dollar','en-HK'],['AED ','AED','UAE Dirham','en-AE'],['R','ZAR','South African Rand','en-ZA'],['MX$','MXN','Mexican Peso','es-MX'],['R$','BRL','Brazilian Real','pt-BR'],['kr ','SEK','Swedish Krona','sv-SE'],['kr ','NOK','Norwegian Krone','nb-NO'],['kr ','DKK','Danish Krone','da-DK'],['zł ','PLN','Polish Złoty','pl-PL'],['₱','PHP','Philippine Peso','en-PH'],['₦','NGN','Nigerian Naira','en-NG'],['RM ','MYR','Malaysian Ringgit','en-MY'],['₩','KRW','South Korean Won','ko-KR'],['₺','TRY','Turkish Lira','tr-TR']];\nconst curInfo=s=>{const e=CURRENCIES.find(x=>x[1]===s.currency);if(e)return {sym:e[0],code:e[1],loc:e[3]};return {sym:s.sym||'',code:'CUSTOM',loc:'en-US'};};\nconst money=(n,s)=>{const c=curInfo(s);n=Math.round(+n||0);if(c.code==='CUSTOM')return (n<0?'-':'')+c.sym+Math.abs(n).toLocaleString('en-US');try{return new Intl.NumberFormat(c.loc,{style:'currency',currency:c.code,maximumFractionDigits:0}).format(n);}catch(e){return c.sym+n;}};\nconst STATUSES=['Idea','Bought','Wrapped','Given'];\nconst TAGS={Idea:'tag tag-outline',Bought:'tag tag-accent',Wrapped:'tag tag-accent-2',Given:'tag tag-neutral'};\nconst GROUPS=['Family','Friends','Kids','Work','Other'];\nconst CATS=[['gifts','Gifts',55],['food','Food & drinks',18],['decor','Decorations',8],['wrap','Wrapping & cards',4],['travel','Travel',7],['events','Parties & outings',5],['charity','Giving & charity',3]];\nconst PHASES=['Early November','Late November','Black Friday & Cyber Monday','Early December','Mid December','Christmas week','After Christmas'];\nconst CHECK=[['Set your Christmas budget','Make your gift list','Check last year’s gifts & cards','Book travel or hosting plans'],['Order personalised gifts','Buy cards & stamps','Plan the Christmas menu'],['Shop the deals on your list','Compare prices before you buy','Order online gifts early'],['Put up the tree & decorations','Write and send cards','Book food delivery or order the turkey'],['Last day for standard shipping: check your carrier','Wrap gifts','Buy stocking fillers'],['Pick up fresh food','Prep make-ahead dishes','Put gifts under the tree'],['Write thank-you notes','Return or exchange gifts','Note what worked for next year']];\nconst MENU=[['starter','Starters','e.g. Prawn cocktail, soup'],['main','Main','e.g. Roast turkey with stuffing'],['sides','Sides','e.g. Roast potatoes, sprouts, gravy'],['dessert','Dessert','e.g. Christmas pudding, mince pies'],['drinks','Drinks','e.g. Mulled wine, eggnog']];\nconst uid=()=>Math.random().toString(36).slice(2,10);\nconst pad=n=>String(n).padStart(2,'0');\nconst NOW=new Date();\nconst TODAY=NOW.getFullYear()+'-'+pad(NOW.getMonth()+1)+'-'+pad(NOW.getDate());\nconst CUR_XMAS=(NOW.getMonth()===11&&NOW.getDate()>26)?NOW.getFullYear()+1:NOW.getFullYear();\nconst diffDays=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);\nconst MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst sum=(a,f)=>a.red
